name: HTML2PDF static checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate HTML and inline JavaScript
        run: python scripts/validate_html.py
